- name: configure mysql server
  hosts: mysqld
  become: yes
  tasks:
  - name: enable mysql:8.4
    command: dnf module enable mysql:8.4 -y

  - name: install mysql
    package: 
      name: mysql
      state: present

  - name: enable and start mysql
    service:                      
      name: mysql               
      state: restarted          
      enabled: yes              